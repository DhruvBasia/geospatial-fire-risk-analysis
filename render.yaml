services:
  # Option 1: Static Site (Recommended: 100% Free, Instant CDN, Never sleeps)
  - type: static
    name: seelampur-fire-risk-map
    buildCommand: python generate_app.py
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /
        destination: /index.html
