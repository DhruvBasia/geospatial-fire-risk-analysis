<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Firebreak">
  <defs>
    <linearGradient id="fb-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F2B4D"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <linearGradient id="fb-fire" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFB25E"/><stop offset=".55" stop-color="#F0452F"/><stop offset="1" stop-color="#D7263D"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#fb-tile)" stroke="#FFFFFF" stroke-opacity=".14"/>
  <!-- Fire on the left, held back by a clean break from the protected side -->
  <path fill="url(#fb-fire)" d="M14 50V26c0-6.600 5.400-12 12-12h9L20 50z"/>
  <path fill="#F5F7FF" d="M30 50l15-36h5v24c0 6.600-5.400 12-12 12z"/>
